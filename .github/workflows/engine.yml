# Paper-trading engine for short-dated options. PAPER ONLY: no broker, no real orders, no secrets.
#
# GitHub cron is UTC, may start 5-30+ min late and may skip runs, so several redundant starts are scheduled.
# The concurrency group allows ONE running job (the only writer of data/state.json); later triggers wait
# in the queue (a newer trigger replaces an older queued one) and start the moment the running job exits.
# Each job pulls the latest committed state, runs until min(start + 5h40m, close + 15 min) ET, then exits.
# Self-chaining: a job that stops at its 5h40m cap while the session window is still open queues the next run
# itself (`gh workflow run` with GITHUB_TOKEN), so coverage does not depend on cron. It never chains on
# weekends/holidays, after the close, or after a short (<30 min) run. Extra or queued starts are harmless:
# they wait for the running job, resume from the committed state, and exit after one check outside the session.
#
# Starts (Mon-Fri), times in America/New_York (GitHub's `timezone` key, so DST is handled by GitHub):
#   09:07 09:22 09:37 09:52            morning job (redundant starts; extras just queue)
#   12:07 ... 14:37 every 30 min       backup in case the morning job died (normally replaced by the self-chain)
#   16:25                              after-close pass: settles expirations if needed, then exits
name: paper-engine

on:
  schedule:
    - cron: "7,22,37,52 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "7,37 12,13,14 * * 1-5"
      timezone: "America/New_York"
    - cron: "25 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: paper-engine
  cancel-in-progress: false

permissions:
  contents: write   # commit data/state.json
  actions: write    # self-chain: queue the next run of this workflow

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: America/New_York
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Run engine until hand-off time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u ci_runner.py
