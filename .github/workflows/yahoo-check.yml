# Manual check that Yahoo Finance (yfinance) answers from a GitHub-hosted runner.
# Runs dryrun.py: real chains, test state only, nothing committed. PAPER ONLY.
name: yahoo-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u dryrun.py
